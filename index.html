<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Designly Creative OS — AI alapú kreatív platform</title>
<meta name="description" content="A Designly Studio AI-alapú kreatív platformja: alkoss, tervezz, streameld és dominálj — sablonok, brand eszközök és AI-grafikák egy helyen.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d9a94e;--gold-lt:#f0cf8b;--gold-hi:#ffecc4;
    --ink:#05070c;--panel:rgba(12,16,24,.78);--panel-solid:rgba(9,12,19,.92);
    --line:rgba(217,169,78,.28);--line-soft:rgba(217,169,78,.14);
    --txt:#eceef3;--muted:#9ba3b2;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    --nav-h:74px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--ink);color:var(--txt);font-family:var(--sans);overflow-x:hidden;
    -webkit-font-smoothing:antialiased;font-weight:300}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  .shell{width:100%;max-width:1480px;margin:0 auto;padding:0 30px}

  /* NAV */
  .nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:120;display:flex;align-items:center;
    border-bottom:1px solid transparent;transition:background .45s ease,border-color .45s ease,backdrop-filter .45s ease}
  .nav.scrolled{background:rgba(5,7,12,.88);backdrop-filter:blur(16px);border-bottom-color:var(--line)}
  .nav .shell{display:flex;align-items:center;gap:34px}
  .brand{display:flex;align-items:center;gap:13px;flex-shrink:0}
  .brand-mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    font-family:var(--serif);font-weight:600;font-size:1.5rem;color:#1a1206;
    background:radial-gradient(circle at 35% 30%,#ffeec6,#dcae55 45%,#a97c28);
    box-shadow:0 0 22px rgba(217,169,78,.5),inset 0 0 10px rgba(255,255,255,.55);
    border:1px solid rgba(255,238,198,.6)}
  .brand-txt b{display:block;font-family:var(--serif);font-size:1.02rem;letter-spacing:.3em;
    text-transform:uppercase;color:#f5f1e6;font-weight:500}
  .brand-txt span{display:block;font-size:.55rem;letter-spacing:.44em;text-transform:uppercase;
    color:var(--gold);margin-top:4px}
  .menu{display:flex;align-items:center;gap:2px;margin-left:auto}
  .menu a{position:relative;padding:10px 15px;font-size:.73rem;letter-spacing:.2em;text-transform:uppercase;
    color:#c3c9d5;border-radius:6px;transition:color .25s ease,background .25s ease;white-space:nowrap}
  .menu a:hover{color:var(--gold-hi);background:rgba(217,169,78,.07)}
  .menu a::after{content:"";position:absolute;left:15px;right:15px;bottom:5px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);transition:transform .32s ease}
  .menu a:hover::after{transform:scaleX(1)}
  .nav-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .lang{display:flex;align-items:center;gap:7px;font-size:.72rem;letter-spacing:.16em;color:#c3c9d5;
    text-transform:uppercase;cursor:pointer;padding:8px 6px;background:none;border:none;transition:color .25s ease}
  .lang:hover{color:var(--gold-hi)}
  .lang .globe{border:1px solid var(--line);border-radius:50%;width:18px;height:18px;flex-shrink:0}
  .lang .caret{font-size:.55rem;opacity:.7}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 26px;border-radius:8px;
    font-size:.76rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
    border:1px solid transparent;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,border-color .25s ease,color .25s ease}
  .btn-primary{background:linear-gradient(180deg,#f4d894,#d2a342 60%,#b4862c);color:#221806;
    box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,248,222,.7)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(240,207,139,.55),0 12px 30px rgba(0,0,0,.55)}
  .btn-ghost{background:rgba(8,11,18,.55);border-color:var(--line);color:#eddfc0;backdrop-filter:blur(6px)}
  .btn-ghost:hover{transform:translateY(-2px);border-color:var(--gold-lt);box-shadow:0 0 22px rgba(217,169,78,.28)}
  .btn-sm{padding:11px 20px;font-size:.71rem}
  .arrow{transition:transform .25s ease}
  .btn:hover .arrow{transform:translateX(4px)}
  .burger{display:none;width:42px;height:42px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:#d6dbe5;font-size:1.1rem;cursor:pointer}

  /* HERO */
  .hero{position:relative;min-height:100vh;padding-top:var(--nav-h);overflow:hidden;background:#04060a;
    display:flex;flex-direction:column}
  .bg{position:absolute;inset:0;background-image:url("artwork.jpg");background-size:cover;
    background-position:center 30%;filter:saturate(1.02) contrast(1.05);transform:scale(1.03);
    animation:drift 46s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.03) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(-1.3%,-1.1%,0)}}
  .veil{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(70% 55% at 50% 44%,rgba(0,0,0,0) 30%,rgba(3,5,9,.72) 100%),
    linear-gradient(180deg,rgba(3,5,9,.85) 0%,rgba(3,5,9,.25) 12%,rgba(3,5,9,0) 34%,rgba(3,5,9,.6) 74%,#04060a 100%)}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;opacity:.85}
  .rune{position:absolute;font-family:'Segoe UI Symbol',Georgia,serif;color:var(--gold);
    text-shadow:0 0 7px rgba(217,169,78,.65);opacity:.4;user-select:none;pointer-events:none;
    animation:runeFlicker 4.6s ease-in-out infinite}
  @keyframes runeFlicker{0%,100%{opacity:.24;text-shadow:0 0 5px rgba(217,169,78,.35)}
    46%{opacity:.45;text-shadow:0 0 9px rgba(217,169,78,.5)}
    88%{opacity:1;color:#fff4d6;text-shadow:0 0 20px rgba(255,220,150,1),0 0 42px rgba(226,178,88,.85)}
    93%{opacity:.5;text-shadow:0 0 9px rgba(217,169,78,.6)}}
  .rune.climb{animation:runeClimb 10s linear infinite;will-change:transform,opacity;opacity:0}
  @keyframes runeClimb{0%{transform:translateY(0) scale(.85);opacity:0}14%{opacity:.7}
    42%{opacity:1;color:#fff4d4;text-shadow:0 0 22px rgba(255,220,150,1),0 0 44px rgba(226,178,88,.9)}
    56%{opacity:.35}74%{opacity:.9;color:#bfe2ff;text-shadow:0 0 18px rgba(150,215,255,1),0 0 36px rgba(80,150,255,.8)}
    100%{transform:translateY(-72vh) scale(1.05);opacity:0}}
  .eye{position:absolute;width:30px;height:30px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,220,140,.75) 22%,rgba(255,150,40,.35) 46%,rgba(255,150,40,0) 70%);
    filter:blur(1px);opacity:0;transform:scale(.6);animation:eyePulse 5.8s ease-in-out infinite}
  .eye.blue{background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(150,220,255,.8) 22%,rgba(40,140,255,.35) 46%,rgba(40,140,255,0) 70%)}
  @keyframes eyePulse{0%,72%,100%{opacity:0;transform:scale(.55)}78%{opacity:1;transform:scale(1.4)}
    82%{opacity:.85;transform:scale(1.12)}87%{opacity:1;transform:scale(1.32)}93%{opacity:0;transform:scale(.6)}}
  .medallion{position:absolute;left:50%;top:20.5%;width:clamp(180px,20vw,296px);aspect-ratio:1;
    transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;opacity:.85}
  .medallion > *{position:absolute;inset:0;border-radius:50%}
  .ring-a{border:2px dashed rgba(255,214,140,.42);animation:spin 38s linear infinite}
  .ring-b{inset:17%;border:1px solid rgba(255,230,180,.36);animation:spin 24s linear infinite reverse}
  .rays{inset:5%;background:repeating-conic-gradient(from 0deg,rgba(255,214,140,.5) 0deg 2deg,rgba(255,214,140,0) 2deg 24deg);
    -webkit-mask:radial-gradient(circle,transparent 50%,#000 64%,#000 94%,transparent 100%);
    mask:radial-gradient(circle,transparent 50%,#000 64%,#000 94%,transparent 100%);animation:spin 54s linear infinite;opacity:.62}
  .rays.rev{inset:24%;background:repeating-conic-gradient(from 8deg,rgba(255,240,200,.55) 0deg 1.5deg,rgba(255,240,200,0) 1.5deg 32deg);
    -webkit-mask:radial-gradient(circle,transparent 42%,#000 62%,#000 92%,transparent 100%);
    mask:radial-gradient(circle,transparent 42%,#000 62%,#000 92%,transparent 100%);animation:spin 32s linear infinite reverse}
  .glowcore{inset:28%;background:radial-gradient(circle,rgba(255,242,214,.72) 0%,rgba(255,204,120,.38) 42%,rgba(255,180,80,.12) 66%,rgba(255,180,80,0) 80%);
    animation:coreGlow 4.8s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes coreGlow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
  .raven-tag{position:absolute;top:20.5%;transform:translateY(-50%);text-align:center;pointer-events:none;
    text-shadow:0 2px 16px rgba(0,0,0,.95)}
  .raven-tag.left{left:calc(50% - clamp(215px,25.5vw,380px))}
  .raven-tag.right{right:calc(50% - clamp(215px,25.5vw,380px))}
  .raven-tag b{display:block;font-family:var(--serif);font-size:clamp(.8rem,1.15vw,1.02rem);letter-spacing:.3em;
    text-transform:uppercase;color:var(--gold-lt);font-weight:500}
  .raven-tag span{display:block;font-size:.56rem;letter-spacing:.36em;text-transform:uppercase;color:#98a1b0;margin-top:6px}
  .slogan{position:absolute;right:30px;top:31%;text-align:right;max-width:280px;pointer-events:none;
    text-shadow:0 2px 16px rgba(0,0,0,.95)}
  .slogan span{display:block;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:#98a1b0}
  .slogan b{display:block;font-family:var(--serif);font-size:1.15rem;letter-spacing:.14em;color:#f3ecdd;font-weight:500;margin-top:8px}
  .slogan::after{content:"";display:block;margin-left:auto;margin-top:14px;width:70px;height:1px;
    background:linear-gradient(270deg,var(--gold),transparent)}
  .rail{position:absolute;left:30px;top:34%;z-index:6;display:flex;flex-direction:column;gap:2px}
  .rail a{display:flex;flex-direction:column;gap:5px;padding:14px 0 14px 18px;border-left:1px solid var(--line-soft);
    transition:border-color .3s ease,transform .3s ease}
  .rail a:hover{border-left-color:var(--gold);transform:translateX(4px)}
  .rail b{font-size:.66rem;letter-spacing:.28em;color:var(--gold);font-weight:600}
  .rail span{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:#9aa2b1}
  .hero-mid{position:relative;z-index:6;margin:auto;text-align:center;padding:0 30px;max-width:1100px}
  .studio-mark{display:block;font-family:var(--serif);font-size:clamp(3rem,9vw,7.6rem);line-height:.92;
    letter-spacing:.04em;text-transform:uppercase;
    background:linear-gradient(180deg,#fff8e6 0%,#f3d9a4 26%,#c99a3c 62%,#8e6520 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 26px rgba(0,0,0,.85)) drop-shadow(0 0 34px rgba(217,169,78,.28))}
  .studio-rule{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px}
  .studio-rule i{width:clamp(40px,9vw,120px);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .studio-rule em{font-family:var(--serif);font-style:normal;font-size:clamp(.72rem,1.5vw,1.12rem);
    letter-spacing:.5em;text-transform:uppercase;color:#e8dcc0;text-shadow:0 2px 18px rgba(0,0,0,.9)}
  .kicker{margin-top:26px;font-size:.6rem;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);opacity:.95}
  .tagline{margin-top:22px;font-family:var(--serif);font-size:clamp(1.05rem,2.5vw,1.85rem);letter-spacing:.16em;
    text-transform:uppercase;color:#f2ebdc;text-shadow:0 3px 24px rgba(0,0,0,.9)}
  .tagline .dot{color:var(--gold);padding:0 .2em}
  .subline{margin-top:14px;font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:#9aa3b2}
  .hero-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:36px}
  .features{position:relative;z-index:6;margin-top:auto;display:grid;grid-template-columns:repeat(6,1fr);
    border-top:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(4,6,11,0),rgba(4,6,11,.72) 40%)}
  .feature{padding:26px 18px 30px;text-align:center;border-left:1px solid var(--line-soft);transition:background .3s ease}
  .feature:first-child{border-left:none}
  .feature:hover{background:rgba(217,169,78,.05)}
  .feature .glyph{width:30px;height:30px;margin:0 auto 14px;border:1px solid var(--gold);border-radius:5px;position:relative;
    opacity:.9;box-shadow:0 0 14px rgba(217,169,78,.35);transform:rotate(45deg)}
  .feature .glyph::after{content:"";position:absolute;inset:7px;border:1px solid rgba(217,169,78,.6);border-radius:2px}
  .feature b{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#efe3c8;font-weight:600}
  .feature span{display:block;font-size:.72rem;color:#8f97a6;margin-top:8px;line-height:1.5}

  /* CHAT */
  .chat{position:fixed;right:26px;bottom:26px;z-index:130;width:322px;border-radius:14px;overflow:hidden;
    background:var(--panel-solid);border:1px solid var(--line);
    box-shadow:0 26px 70px rgba(0,0,0,.72),0 0 40px rgba(217,169,78,.08);backdrop-filter:blur(14px)}
  .chat-head{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,rgba(217,169,78,.12),rgba(217,169,78,0))}
  .chat-head .mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    font-family:var(--serif);font-weight:600;color:#1a1206;font-size:1rem;
    background:radial-gradient(circle at 35% 30%,#ffeec6,#dcae55 50%,#a97c28);flex-shrink:0}
  .chat-head .who{line-height:1.2}
  .chat-head .who b{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#f2e8d2;font-weight:600}
  .chat-head .who span{display:block;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:#9aa2b1;margin-top:3px}
  .chat-close{margin-left:auto;background:none;border:none;color:#8f97a6;font-size:1rem;cursor:pointer;
    transition:color .25s ease;padding:4px 6px}
  .chat-close:hover{color:var(--gold-lt)}
  .chat-body{padding:16px}
  .chat-body p{font-size:.82rem;line-height:1.65;color:#c4cad6}
  .chat-body p + p{margin-top:10px}
  .chat-body .hi{color:#f0d79a}
  .chat-cta{margin-top:16px;display:flex;align-items:center;gap:10px}
  .chat-cta .btn{flex:1;padding:11px 16px;font-size:.68rem}
  .status{display:flex;align-items:center;gap:7px;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:#7fd18a}
  .status i{width:7px;height:7px;border-radius:50%;background:#5ecf72;box-shadow:0 0 9px #5ecf72;animation:blink 2.2s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .chat-toggle{position:fixed;right:26px;bottom:26px;z-index:131;width:56px;height:56px;border-radius:50%;
    display:none;place-items:center;border:1px solid var(--line);cursor:pointer;font-size:1.3rem;
    background:radial-gradient(circle at 35% 30%,#ffeec6,#dcae55 50%,#a97c28);color:#1a1206;
    box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 26px rgba(217,169,78,.4)}
  .chat.hidden{display:none}
  .chat-toggle.show{display:grid}

  /* MARQUEE */
  .marquee{position:relative;overflow:hidden;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
    padding:22px 0;background:rgba(4,6,11,.5)}
  .marquee-track{display:flex;gap:64px;width:max-content;animation:slide 38s linear infinite}
  .marquee-track span{font-family:var(--serif);font-size:1.05rem;letter-spacing:.3em;text-transform:uppercase;
    color:#8b93a2;white-space:nowrap}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* SECTIONS */
  .section{position:relative;padding:120px 0;overflow:hidden}
  .section.darker{background:linear-gradient(180deg,#04060a,#070b13 50%,#04060a)}
  .section.darker::before{content:"";position:absolute;inset:0;
    background:radial-gradient(60% 50% at 50% 0%,rgba(217,169,78,.07),rgba(0,0,0,0) 70%)}
  .section .shell{position:relative;z-index:2}
  .sec-head{text-align:center;max-width:780px;margin:0 auto 62px}
  .sec-head .kick{font-size:.6rem;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  h2.big{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,4vw,3rem);line-height:1.12;color:#f2eee6}
  h2.big em{font-style:italic;background:linear-gradient(100deg,#ffe6ab,#d9a94e 50%,#fff1c9);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sec-head p{margin-top:20px;color:var(--muted);line-height:1.78;font-size:.98rem}

  /* SHOWCASE */
  .showcase{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .shot{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line-soft);aspect-ratio:4/3;
    background:#0a0e16;margin:0}
  .shot .art{position:absolute;inset:0;background-image:url("artwork.jpg");background-size:cover;background-position:center;
    filter:saturate(.85) brightness(.7);transition:transform .6s ease,filter .6s ease}
  .shot:nth-child(2) .art{background-position:20% 40%}
  .shot:nth-child(3) .art{background-position:80% 60%}
  .shot:nth-child(4) .art{background-position:50% 20%}
  .shot:hover .art{transform:scale(1.07);filter:saturate(1.05) brightness(.92)}
  .shot figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px;font-size:.7rem;letter-spacing:.2em;
    text-transform:uppercase;color:#f1e6cb;background:linear-gradient(0deg,rgba(4,6,10,.92),transparent)}

  /* SPLIT */
  .split{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
  .split-art{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line-soft);aspect-ratio:5/4;
    box-shadow:0 26px 66px rgba(0,0,0,.7)}
  .split-art .art{position:absolute;inset:0;background-image:url("artwork.jpg");background-size:cover;
    background-position:center 30%;filter:brightness(.72) saturate(.95)}
  .split-art::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(4,6,10,0) 40%,rgba(4,6,10,.7) 100%)}
  .split-copy .kick{font-size:.6rem;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
  .split-copy h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.12;color:#f2eee6}
  .split-copy h2 em{font-style:italic;background:linear-gradient(100deg,#ffe6ab,#d9a94e 50%,#fff1c9);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .split-copy p{margin-top:18px;color:var(--muted);line-height:1.78;font-size:.96rem}
  .split-list{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:13px}
  .split-list li{display:flex;gap:12px;font-size:.9rem;color:#bcc3cf;line-height:1.6}
  .split-list li::before{content:"◆";color:var(--gold);flex-shrink:0;font-size:.62rem;line-height:1.7}

  /* TIMELINE */
  .timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px}
  .tl-item{position:relative;padding-top:34px;border-top:1px solid var(--line-soft)}
  .tl-item b{font-family:var(--serif);font-size:2.6rem;line-height:1;color:rgba(217,169,78,.4);display:block;margin-bottom:12px}
  .tl-item h3{font-size:.86rem;letter-spacing:.18em;text-transform:uppercase;color:#f0e5cb;margin-bottom:10px;font-weight:600}
  .tl-item p{font-size:.9rem;color:#9098a7;line-height:1.7}
  .tl-item::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 12px rgba(217,169,78,.8)}

  /* PLANS */
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:24px;align-items:start}
  .plan{position:relative;padding:44px 32px;border-radius:16px;border:1px solid var(--line-soft);
    background:linear-gradient(180deg,rgba(12,16,24,.9),rgba(6,9,14,.9));
    transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease}
  .plan:hover{transform:translateY(-6px);border-color:var(--line)}

  .f-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-top:26px;

  .socials a:hover{border-color:var(--gold);color:var(--gold-hi);box-shadow:0 0 16px rgba(217,169,78,.3)}
  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,150%);z-index:200;padding:14px 24px;

  @media (max-width:1240px){.features{grid-template-columns:repeat(3,1fr)}
    .feature:nth-child(4){border-left:none}.feature{border-top:1px solid var(--line-soft)}

    .menu.open{transform:none}
    .menu a{padding:16px 4px;border-bottom:1px solid var(--line-soft);font-size:.82rem}

  @media (max-width:760px){.shell{padding:0 20px}.nav .shell{gap:16px}.brand-txt span{display:none}

  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}
    .reveal{opacity:1;transform:none}.bg{animation:none}.marquee-track{animation:none}}
